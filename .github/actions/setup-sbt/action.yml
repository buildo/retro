name: Setup sbt
description: Temurin JDK with the sbt cache, and the sbt launcher.

inputs:
  java-version:
    description: JDK version
    default: "8"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: sbt

    - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
